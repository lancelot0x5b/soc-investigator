[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-investigator"
version = "0.1.0"
description = "SOC Investigator — deterministic evidence-first SIEM investigation assistant (spec v0.2.6)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<0.17",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
soc-investigator = "soc_investigator.cli:app"

[tool.setuptools]
packages = ["soc_investigator"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
